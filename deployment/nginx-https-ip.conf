# Serve the app and UC API with a trusted certificate for the VPS IP.
# The certificate is renewed by Certbot's shortlived-profile renewal timer.
log_format myjoin_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/myjoin/current;
    index index.php index.html;
    client_max_body_size 100M;
    access_log /var/log/nginx/myjoin_https_access.log myjoin_safe;

    ssl_certificate /etc/letsencrypt/live/103.118.17.117/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.118.17.117/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /deployment/ {
        return 404;
    }

    location ^~ /tools/ {
        return 404;
    }

    location = /api/v1/uc_api.php {
        return 404;
    }

    location ~ ^/api/v1/(get-auth-token|get-bio-token|get-pid|getStatusUc|verify-otp|verify-otp-uc|upload-uc-count)/?$ {
        # If an older release replaces the authenticated API, refuse HTTPS
        # requests instead of exposing its old UC_API_REQUIRE_AUTH=0 behavior.
        if (!-f $document_root/api/v1/.uc_device_auth_ready) {
            return 503;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/uc_api.php;
        fastcgi_param QUERY_STRING route=$1&$query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(sql|zip|tar|gz|tgz|7z|log|ini|key|pem|env)$ {
        deny all;
    }
}